      - "flm-aider"
      - "flm-atomcode"
      - "flm-claude"
      - "flm-cline"
      - "flm-codex"
      - "flm-crush"
      - "flm-cursor"
      - "flm-dsh"
      - "flm-gemini"
      - "flm-goose"
      - "flm-hermes"
      - "flm-kilo"
      - "flm-mimo"
      - "flm-openclaw"
      - "flm-opencode"
      - "flm-qwen"
